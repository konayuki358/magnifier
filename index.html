<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="無料・広告なし。スマホのカメラで小さな文字を拡大して読めるシンプルな拡大鏡。">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>拡大鏡</title>
</head>
<body>
  <main id="app" aria-label="拡大鏡">
    <div id="cameraStage" class="camera-stage" aria-label="カメラ映像。2本指で拡大・縮小できます">
      <video id="camera" class="camera-image" autoplay playsinline muted aria-label="カメラ映像"></video>
      <canvas id="still" class="camera-image still" aria-hidden="true"></canvas>
      <div id="shade" class="shade" aria-hidden="true"></div>
    </div>

    <div class="top-bar">
      <div class="brand" aria-label="拡大鏡">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"></circle><path d="m15.6 15.6 5 5"></path></svg>
        <span>拡大鏡</span>
      </div>
      <div class="zoom-badge" aria-live="off"><output id="zoomText" for="zoomRange">1.0×</output></div>
    </div>

    <section id="cameraMessage" class="camera-message" role="status" aria-live="polite">
      <div class="message-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h3l1.3-2h5.4L16 5h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="12.5" r="4"></circle></svg>
      </div>
      <p id="messageTitle" class="message-title">カメラを起動しています…</p>
      <p id="messageDetail" class="message-detail">カメラの使用を許可してください。</p>
      <button id="retryButton" class="retry-button" type="button" hidden>もう一度試す</button>
    </section>

    <section id="controls" class="controls" aria-label="拡大鏡の操作" hidden>
      <div class="zoom-line">
        <span class="zoom-mark" aria-hidden="true">1×</span>
        <label class="sr-only" for="zoomRange">拡大倍率</label>
        <input id="zoomRange" type="range" min="1" max="8" step="0.1" value="1" aria-label="拡大倍率">
        <span class="zoom-mark" aria-hidden="true">8×</span>
      </div>
      <div class="action-line">
        <button id="torchButton" class="action-button" type="button" aria-label="ライトをつける" aria-pressed="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v7l-2.5 3.5V21h-3v-7.5L8 10z"></path><path d="M8 7h8"></path></svg>
          <span id="torchLabel">ライト</span>
        </button>
        <button id="freezeButton" class="action-button" type="button" aria-label="映像を一時停止する" aria-pressed="false">
          <svg id="freezeIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
          <span id="freezeLabel">一時停止</span>
        </button>
      </div>
      <p id="gestureHint" class="gesture-hint">2本指で広げる・縮める</p>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
